<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiCareerQuest — Venue manifest preview</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#edf3f4;color:#19394b;font:16px/1.6 system-ui,sans-serif}
  main{max-width:900px;margin:6vh auto;padding:0 24px 60px}
  h1{font-size:28px;margin:0 0 4px}
  p.lead{color:#5a7180;margin:0 0 24px}
  .sector{margin:0 0 26px}
  .sector h2{font-size:15px;text-transform:uppercase;letter-spacing:1px;color:#5a7180;margin:0 0 10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .booth{border-radius:12px;padding:14px;color:#fff;position:relative;min-height:90px}
  .booth .num{position:absolute;top:8px;right:10px;font-size:12px;opacity:.85}
  .booth strong{display:block;font-size:14px;margin-bottom:4px}
  .booth span{font-size:12px;opacity:.9}
  .booth.demo{background:#8a8f98!important}
  .note{font-size:12px;color:#5a7180;margin-top:2px}
</style>
</head>
<body>
<main>
  <h1>Venue manifest preview</h1>
  <p class="lead">This is a stand-in for what the actual student game fetches from <code>/api/manifest</code> on load — every shipped booth, live, no rebuild needed. Real venue would render these as 3D booths in place of this grid.</p>
  <div id="out">Loading…</div>
</main>
<script>
async function load() {
  const res = await fetch('/api/manifest');
  const data = await res.json();
  const bySector = {};
  for (const b of data.booths) (bySector[b.sector] ||= []).push(b);

  const out = document.getElementById('out');
  out.innerHTML = '';
  const sectors = Object.keys(bySector).sort();
  if (!sectors.length) {
    out.innerHTML = '<p>No booths shipped yet.</p>';
    return;
  }
  for (const sector of sectors) {
    const wrap = document.createElement('div');
    wrap.className = 'sector';
    wrap.innerHTML = `<h2>${sector}</h2>`;
    const grid = document.createElement('div');
    grid.className = 'grid';
    for (const b of bySector[sector].sort((a, z) => a.slot_number - z.slot_number)) {
      const card = document.createElement('div');
      card.className = 'booth' + (b.status === 'demo' ? ' demo' : '');
      card.style.background = b.booth_color || '#0c7580';
      card.innerHTML = `<span class="num">#${b.slot_number}</span>
        <strong>${b.booth_name || '(untitled)'}</strong>
        <span>${(b.booth_description || '').slice(0, 90)}</span>`;
      grid.append(card);
    }
    wrap.append(grid);
    out.append(wrap);
  }
  const note = document.createElement('p');
  note.className = 'note';
  note.textContent = `Last refreshed ${new Date(data.generatedAt).toLocaleTimeString()} — this endpoint is edge-cached for 30s.`;
  out.append(note);
}
load();
setInterval(load, 10000);
</script>
</body>
</html>
