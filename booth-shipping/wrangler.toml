name = "micareerquest-booth-shipping"
pages_build_output_dir = "public"
compatibility_date = "2024-09-23"

# Create with: npx wrangler d1 create micareerquest-slots
# then paste the real database_id it prints below.
[[d1_databases]]
binding = "DB"
database_name = "micareerquest-slots"
database_id = "local-mock"

# Create with: npx wrangler r2 bucket create micareerquest-booths
[[r2_buckets]]
binding = "BOOTHS"
bucket_name = "micareerquest-booths"

# Set the real value with: npx wrangler pages secret put ADMIN_KEY
[vars]
ADMIN_KEY = "dev-only-change-me"
