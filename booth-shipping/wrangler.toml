name = "virtual-micareerquest"
main = "src/index.js"
compatibility_date = "2024-09-23"

[assets]
directory = "public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "micareerquest-slots"
database_id = "dd008013-e814-4ff1-8f65-4307ce40279b"

# Create with: npx wrangler r2 bucket create micareerquest-booths
[[r2_buckets]]
binding = "BOOTHS"
bucket_name = "micareerquest-booths"

# Set the real value in the Cloudflare dashboard's environment variables for
# this Worker -- do not rely on this file's value for the real deployment.
[vars]
ADMIN_KEY = "dev-only-change-me"
