<!doctype html><meta charset="utf-8"><title>Supplied model inspection</title>
<style>body{margin:0;background:#e7edef;font:15px system-ui}canvas{display:block}#names{position:fixed;bottom:16px;left:0;right:0;display:flex;justify-content:space-around}</style>
<script type="importmap">{"imports":{"three":"../pc66/vendor/three/three.module.js","three/addons/":"../pc66/vendor/three/addons/"}}</script>
<div id="names"></div><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const r=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(1);r.setClearColor('#e7edef');document.body.append(r.domElement);const scene=new T.Scene(),camera=new T.PerspectiveCamera(36,innerWidth/innerHeight,.01,100);camera.position.set(0,2.3,12);camera.lookAt(0,.85,0);scene.add(new T.HemisphereLight(0xffffff,0x87908c,2.4));const light=new T.DirectionalLight(0xffffff,3);light.position.set(2,5,8);scene.add(light);const ids=['student2','green','casual','stride-a','stride-b','smiling','teenage','scooter'];window.models=[];
const params=new URLSearchParams(location.search),base=params.get('repaired')?'rigged102/':'',mixers=[];window.clips=[];
for(const [i,id]of ids.entries()){if(base&&id==='scooter')continue;const g=await new GLTFLoader().loadAsync('./'+base+id+'.glb');g.scene.position.x=(i-3.5)*1.2;scene.add(g.scene);models.push(g.scene);const mx=new T.AnimationMixer(g.scene);mixers.push(mx);clips.push(g.animations);const label=document.createElement('span');label.textContent=id;document.querySelector('#names').append(label);}
window.ready=true;window.renderView=(yaw=0)=>{for(const m of models)m.rotation.y=yaw;r.render(scene,camera);};renderView();window.renderer=r;window.scene=scene;window.camera=camera;
window.inspect=(index,time=0,close=false,yaw=0)=>{models.forEach((m,i)=>{m.visible=i===index;m.rotation.y=yaw;});const m=models[index],mx=mixers[index];mx.stopAllAction();const clip=clips[index].find(a=>a.name==='Walk');if(clip){mx.clipAction(clip).play();mx.setTime(time);}const x=m.position.x;camera.position.set(x,close?1.57:1.0,close?.65:3.3);camera.lookAt(x,close?1.57:.9,0);r.render(scene,camera);};
window.gaitBounds=(index,time,clipName='Walk')=>{const m=models[index],mx=mixers[index];m.rotation.y=0;mx.stopAllAction();const clip=clips[index].find(a=>a.name===clipName);mx.clipAction(clip).play();mx.setTime(time);m.updateMatrixWorld(true);const box=new T.Box3().setFromObject(m,true);return {min:box.min.toArray(),max:box.max.toArray()};};
</script>
