<!doctype html><html><head><meta charset="utf-8"><script type="importmap">{"imports":{"three":"../../pc66/vendor/three/three.module.js"}}</script><style>body{margin:0}canvas{display:block}</style></head><body><script type="module">
import * as T from 'three';
import {GLTFLoader} from '../../pc66/vendor/three/addons/loaders/GLTFLoader.js';
const scene=new T.Scene();scene.background=new T.Color('#aebdc5');
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);
const camera=new T.PerspectiveCamera(38,innerWidth/innerHeight,.03,1000);scene.add(new T.HemisphereLight(0xe5f4ff,0x51523e,2));

window.showAsset=(name,angle=0)=>{for(const n of entries)scene.remove(n);const chosen=entries.filter(n=>n.name===name);if(!chosen.length)chosen.push(...entries);const b=new T.Box3();for(const n of chosen){scene.add(n);b.expandByObject(n);}const s=b.getSize(new T.Vector3()),c=b.getCenter(new T.Vector3()),d=Math.max(s.x,s.y,s.z)*1.65;camera.position.copy(c).add(new T.Vector3(Math.sin(angle+.65)*d,d*.23,Math.cos(angle+.65)*d));camera.lookAt(c);renderer.render(scene,camera);};
window.ready=true;showAsset(entries[0].name);
</script></body></html>
